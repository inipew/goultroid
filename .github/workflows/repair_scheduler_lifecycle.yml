name: Repair scheduler lifecycle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('internal/app/app.go')
          text = app.read_text()
          old_dispatcher = '''\t\tselect {\n\t\tcase <-ctx.Done():\n\t\t\ta.logger.Warn("global shutdown budget exceeded after dispatcher stop", zap.Error(ctx.Err()))\n\t\t\tif a.eventBus != nil {\n\t\t\t\t_ = a.eventBus.Close()\n\t\t\t}\n\t\t\tif a.db != nil {\n\t\t\t\t_ = a.db.Close()\n\t\t\t}\n\t\t\t_ = a.logger.Sync()\n\t\t\treturn ctx.Err()\n\t\tdefault:\n\t\t}'''
          new_dispatcher = '''\t\tif ctx.Err() != nil {\n\t\t\t// Never close the database while dispatcher workers may still be alive.\n\t\t\t// The process-level shutdown caller owns the final process exit.\n\t\t\ta.logger.Warn("global shutdown budget exceeded after dispatcher stop", zap.Error(ctx.Err()))\n\t\t\treturn ctx.Err()\n\t\t}'''
          if old_dispatcher in text:
              text = text.replace(old_dispatcher, new_dispatcher, 1)

          old_scheduler = '''\t\tselect {\n\t\tcase <-ctx.Done():\n\t\t\ta.logger.Warn("global shutdown budget exceeded after scheduler stop", zap.Error(ctx.Err()))\n\t\t\tif a.eventBus != nil {\n\t\t\t\t_ = a.eventBus.Close()\n\t\t\t}\n\t\t\tif a.db != nil {\n\t\t\t\t_ = a.db.Close()\n\t\t\t}\n\t\t\t_ = a.logger.Sync()\n\t\t\treturn ctx.Err()\n\t\tdefault:\n\t\t}'''
          new_scheduler = '''\t\tif ctx.Err() != nil {\n\t\t\t// StopContext may have timed out while a DB-using scheduler worker is\n\t\t\t// still alive. Closing DB here would violate the DB lifecycle invariant.\n\t\t\ta.logger.Warn("global shutdown budget exceeded after scheduler stop; database remains open until process exit", zap.Error(ctx.Err()))\n\t\t\treturn ctx.Err()\n\t\t}'''
          if old_scheduler in text:
              text = text.replace(old_scheduler, new_scheduler, 1)
          app.write_text(text)

          repo = Path('internal/database/repository.go')
          text = repo.read_text()
          old_query = '''\tquery := `SELECT ` + scheduledJobColumns + ` FROM scheduled_jobs WHERE status IN ('pending', 'running') AND next_run_at <= ? ORDER BY next_run_at ASC`'''
          new_query = '''\tquery := `SELECT ` + scheduledJobColumns + `\n\t\tFROM scheduled_jobs\n\t\tWHERE (status = 'pending' AND next_run_at <= ?)\n\t\t   OR (status = 'running' AND lease_until IS NOT NULL AND lease_until < ? AND next_run_at <= ?)\n\t\tORDER BY next_run_at ASC`'''
          if old_query in text:
              text = text.replace(old_query, new_query, 1)
          repo.write_text(text)

          engine = Path('internal/scheduler/engine.go')
          text = engine.read_text()
          marker = '''func (e *Engine) executeJob(ctx context.Context, job database.ScheduledJob, cancel context.CancelFunc) {'''
          replacement = '''// executeJob deliberately uses an at-least-once external execution model.\n// Database fencing prevents stale workers from mutating durable state, but it\n// cannot roll back a Telegram side effect that succeeded immediately before a\n// worker crash or lease loss. Callers must therefore treat scheduled actions\n// as potentially duplicated across crash recovery.\nfunc (e *Engine) executeJob(ctx context.Context, job database.ScheduledJob, cancel context.CancelFunc) {'''
          if marker in text and replacement not in text:
              text = text.replace(marker, replacement, 1)
          engine.write_text(text)
          PY

          cat > internal/database/scheduler_concurrency_test.go <<'EOF'
          package database_test

          import (
              "context"
              "path/filepath"
              "sync"
              "testing"
              "time"

              "github.com/inipew/goultroid/internal/database"
          )

          func TestClaimDueScheduledJobs_ConcurrentWorkersClaimEachJobOnce(t *testing.T) {
              path := filepath.Join(t.TempDir(), "scheduler.db")
              db1, err := database.Open(path)
              if err != nil { t.Fatalf("open db1: %v", err) }
              defer db1.Close()
              db2, err := database.Open(path)
              if err != nil { t.Fatalf("open db2: %v", err) }
              defer db2.Close()

              ctx := context.Background()
              now := time.Now().UTC()
              const jobCount = 100
              for i := 0; i < jobCount; i++ {
                  _, err := db1.CreateScheduledJob(ctx, &database.ScheduledJob{
                      ChatID: int64(i + 1), PeerType: "chat", ActionType: "message",
                      Payload: "concurrency-test", NextRunAt: now.Add(-time.Second),
                      CreatedAt: now, Status: database.JobStatusPending, MaxAttempts: 3,
                  })
                  if err != nil { t.Fatalf("create job %d: %v", i, err) }
              }

              type claimResult struct { jobs []database.ScheduledJob; err error }
              results := make(chan claimResult, 2)
              var wg sync.WaitGroup
              for _, db := range []*database.DB{db1, db2} {
                  db := db
                  wg.Add(1)
                  go func() {
                      defer wg.Done()
                      var claimed []database.ScheduledJob
                      for {
                          jobs, err := db.ClaimDueScheduledJobs(ctx, time.Now().UTC(), 10, 90*time.Second)
                          if err != nil { results <- claimResult{err: err}; return }
                          if len(jobs) == 0 { break }
                          claimed = append(claimed, jobs...)
                      }
                      results <- claimResult{jobs: claimed}
                  }()
              }
              wg.Wait()
              close(results)

              seen := make(map[int64]int)
              total := 0
              for result := range results {
                  if result.err != nil { t.Fatalf("concurrent claim failed: %v", result.err) }
                  for _, job := range result.jobs { seen[job.ID]++; total++ }
              }
              if total != jobCount { t.Fatalf("expected %d total claims, got %d", jobCount, total) }
              if len(seen) != jobCount { t.Fatalf("expected %d unique claims, got %d", jobCount, len(seen)) }
              for id, count := range seen {
                  if count != 1 { t.Fatalf("job %d was claimed %d times", id, count) }
              }
          }
          EOF

          gofmt -w internal/app/app.go internal/database/repository.go internal/database/scheduler_concurrency_test.go internal/scheduler/engine.go

      - name: Run focused tests
        run: go test ./internal/database ./internal/scheduler ./internal/app

      - name: Commit and remove repair workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair_scheduler_lifecycle.yml
          git add internal/app/app.go internal/database/repository.go internal/database/scheduler_concurrency_test.go internal/scheduler/engine.go
          git commit -m "fix: harden scheduler lifecycle"
          git push origin HEAD:main
