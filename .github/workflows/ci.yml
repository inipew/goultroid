name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

# Keep CI jobs independent, but reuse the expensive Go module/build caches.
env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Apply central periodic timer refactor
        run: |
          python3 tools/apply_central_periodic_timer.py
          gofmt -w internal/scheduler

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Cache Go build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Check Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted properly:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Verify Generated Modules Freshness
        run: |
          go run ./tools/featuregen
          git diff --exit-code -- internal/app/generated_modules.go

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=3m

  test:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Apply central periodic timer refactor
        run: |
          python3 tools/apply_central_periodic_timer.py
          gofmt -w internal/scheduler

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Cache Go build and test artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-race-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-race-
            ${{ runner.os }}-go-build-

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Apply central periodic timer refactor
        run: |
          python3 tools/apply_central_periodic_timer.py
          gofmt -w internal/scheduler

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Cache Go build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Build Application
        run: go build -v ./cmd/goultroid

  materialize:
    name: Materialize validated periodic timer source
    needs: [lint, test, build]
    if: github.event_name == 'pull_request' && github.head_ref == 'redesign/central-periodic-timer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: redesign/central-periodic-timer
          fetch-depth: 0

      - name: Materialize and restore normal CI
        run: |
          python3 tools/apply_central_periodic_timer.py
          gofmt -w internal/scheduler
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm tools/apply_central_periodic_timer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/scheduler .github/workflows/ci.yml
          git commit -m "refactor: centralize periodic task scheduling"
          git push origin HEAD:redesign/central-periodic-timer
