name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ownership fixes
        run: |
          python3 tools/fix_execution_ownership.py
          python3 tools/fix_execution_ownership_test.py
          gofmt -w internal/tasks internal/workers internal/jobs internal/scheduler
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Generated modules freshness
        run: |
          go run ./tools/featuregen
          git diff --exit-code -- internal/app/generated_modules.go
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run --timeout=3m

  test:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ownership fixes
        run: |
          python3 tools/fix_execution_ownership.py
          python3 tools/fix_execution_ownership_test.py
          gofmt -w internal/tasks internal/workers internal/jobs internal/scheduler
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Full race suite
        run: go test -v -race -timeout=12m ./...

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ownership fixes
        run: |
          python3 tools/fix_execution_ownership.py
          python3 tools/fix_execution_ownership_test.py
          gofmt -w internal/tasks internal/workers internal/jobs internal/scheduler
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -v ./cmd/goultroid

  materialize:
    name: Materialize validated ownership source
    needs: [lint, test, build]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Materialize and clean validation scaffolding
        run: |
          python3 tools/fix_execution_ownership.py
          python3 tools/fix_execution_ownership_test.py
          gofmt -w internal/tasks internal/workers internal/jobs internal/scheduler
          rm -f tools/fix_execution_ownership.py tools/fix_execution_ownership_test.py .github/workflows/execution-ownership-fixes.yml
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: centralize execution cancellation ownership"
          git push origin HEAD:${{ github.head_ref }}
