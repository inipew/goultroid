name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Apply P0-P1 execution redesign
        run: |
          python3 tools/normalize_p0_p1_source.py
          python3 tools/apply_p0_p1_execution_redesign.py
          python3 tools/fix_p0_p1_generated.py
          python3 tools/fix_p0_p1_tests.py
          gofmt -w internal/workers internal/telegram internal/jobs internal/scheduler internal/app
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'
      - name: Check Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Go Vet
        run: go vet ./...
      - name: Verify Generated Modules Freshness
        run: |
          go run ./tools/featuregen
          git diff --exit-code -- internal/app/generated_modules.go
      - name: GolangCI-Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run --timeout=3m

  test:
    name: Focused Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Apply P0-P1 execution redesign
        run: |
          python3 tools/normalize_p0_p1_source.py
          python3 tools/apply_p0_p1_execution_redesign.py
          python3 tools/fix_p0_p1_generated.py
          python3 tools/fix_p0_p1_tests.py
          gofmt -w internal/workers internal/telegram internal/jobs internal/scheduler internal/app
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'
      - name: Race workers
        run: go test -race -timeout=3m ./internal/workers
      - name: Race jobs
        run: go test -race -timeout=3m ./internal/jobs
      - name: Race scheduler
        run: go test -race -timeout=3m ./internal/scheduler
      - name: Race telegram
        run: go test -race -timeout=3m ./internal/telegram
      - name: Race app
        run: go test -race -timeout=3m ./internal/app

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Apply P0-P1 execution redesign
        run: |
          python3 tools/normalize_p0_p1_source.py
          python3 tools/apply_p0_p1_execution_redesign.py
          python3 tools/fix_p0_p1_generated.py
          python3 tools/fix_p0_p1_tests.py
          gofmt -w internal/workers internal/telegram internal/jobs internal/scheduler internal/app
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'
      - name: Build Application
        run: go build -v ./cmd/goultroid

  materialize:
    name: Materialize validated source
    if: github.event_name == 'pull_request' && github.head_ref == 'audit-p0-p1-execution-redesign'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: audit-p0-p1-execution-redesign
          fetch-depth: 0
      - name: Materialize source and remove validation scaffolding
        run: |
          python3 tools/normalize_p0_p1_source.py
          python3 tools/apply_p0_p1_execution_redesign.py
          python3 tools/fix_p0_p1_generated.py
          python3 tools/fix_p0_p1_tests.py
          gofmt -w internal/workers internal/telegram internal/jobs internal/scheduler internal/app
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/p0-p1-execution-redesign.yml
          rm -f tools/normalize_p0_p1_source.py tools/apply_p0_p1_execution_redesign.py tools/fix_p0_p1_generated.py tools/fix_p0_p1_tests.py race-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: unify p0-p1 execution control"
          git push origin HEAD:audit-p0-p1-execution-redesign
