name: CI

on:
  push:
    branches: [ main, master, test-next ]
  pull_request:
    branches: [ main, master, test-next ]

# Keep CI jobs independent, but reuse the expensive Go module/build caches.
env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Cache Go build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Check Formatting (gofmt)
        run: |
          gofmt -d . | tee gofmt.diff
          test ! -s gofmt.diff

      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gofmt-diff
          path: gofmt.diff

      - name: Go Vet
        run: go vet ./...

      - name: Verify Generated Modules Freshness
        run: |
          go run ./tools/featuregen
          git diff --exit-code -- internal/app/generated_modules.go

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=3m

  test:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Cache Go build and test artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-race-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-race-
            ${{ runner.os }}-go-build-

      - name: Run Tests with Race Detector
        shell: bash
        run: |
          set -o pipefail
          go test -v -race ./... 2>&1 | tee test.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Cache Go build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Build Application
        shell: bash
        run: |
          set -o pipefail
          go build -v ./cmd/goultroid 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
