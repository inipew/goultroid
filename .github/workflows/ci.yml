name: CI

on:
  push:
    branches: [ main, master, test-next ]
  pull_request:
    branches: [ main, master, test-next ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Check Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted properly:"
            echo "$unformatted"
            echo
            echo "gofmt diff:"
            gofmt -d $unformatted
            exit 1
          fi

      - name: Verify Generated Modules Freshness
        run: |
          go run ./tools/featuregen
          git diff --exit-code -- internal/app/generated_modules.go

      - name: Go Vet
        run: go vet ./...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=3m

      - name: Verify Clean Repository
        run: git diff --exit-code

  test:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Run Tests with Race Detector & Coverage
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Generate Coverage Summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo "### Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            TOTAL_COV=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}')
            echo "| Total Statement Coverage | **${TOTAL_COV}** |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Build Application
        run: go build -v -ldflags="-s -w" -o bin/goultroid ./cmd/goultroid

      - name: Smoke Test Binary
        run: ./bin/goultroid version

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goultroid-linux-amd64
          path: bin/goultroid
          retention-days: 7
