name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Apply P0-P1 execution redesign
        run: |
          python3 tools/normalize_p0_p1_source.py
          python3 tools/apply_p0_p1_execution_redesign.py
          python3 tools/fix_p0_p1_generated.py
          gofmt -w internal/workers internal/telegram internal/jobs internal/scheduler internal/app
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'
      - name: Check Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Go Vet
        run: go vet ./...
      - name: Verify Generated Modules Freshness
        run: |
          go run ./tools/featuregen
          git diff --exit-code -- internal/app/generated_modules.go
      - name: Capture GolangCI-Lint
        id: lintcheck
        continue-on-error: true
        run: |
          set -o pipefail
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run --timeout=3m 2>&1 | tee lint.log
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-p1-lint-diagnostics
          path: lint.log
      - name: Require clean lint
        if: steps.lintcheck.outcome != 'success'
        run: exit 1

  test:
    name: Focused Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Apply P0-P1 execution redesign
        run: |
          python3 tools/normalize_p0_p1_source.py
          python3 tools/apply_p0_p1_execution_redesign.py
          python3 tools/fix_p0_p1_generated.py
          gofmt -w internal/workers internal/telegram internal/jobs internal/scheduler internal/app
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'
      - name: Capture Focused Race Tests
        id: racecheck
        continue-on-error: true
        run: |
          set -o pipefail
          go test -v -race ./internal/workers ./internal/jobs ./internal/scheduler ./internal/telegram ./internal/app 2>&1 | tee race.log
      - name: Upload focused race diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-p1-focused-race-diagnostics
          path: race.log
      - name: Persist focused race diagnostics
        if: steps.racecheck.outcome != 'success'
        run: |
          cp race.log race-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add race-diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist focused race diagnostics"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Require clean focused race tests
        if: steps.racecheck.outcome != 'success'
        run: exit 1

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Apply P0-P1 execution redesign
        run: |
          python3 tools/normalize_p0_p1_source.py
          python3 tools/apply_p0_p1_execution_redesign.py
          python3 tools/fix_p0_p1_generated.py
          gofmt -w internal/workers internal/telegram internal/jobs internal/scheduler internal/app
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'
      - name: Build Application
        run: go build -v ./cmd/goultroid
