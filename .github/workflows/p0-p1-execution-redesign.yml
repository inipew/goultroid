name: P0-P1 execution redesign

on:
  push:
    branches:
      - audit-p0-p1-execution-redesign

permissions:
  contents: write

jobs:
  rewrite-and-validate:
    if: github.event.head_commit.message == 'chore: run p0-p1 execution rewrite'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-p0-p1-execution-redesign
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply scoped redesign
        run: python3 tools/normalize_p0_p1_source.py && python3 tools/apply_p0_p1_execution_redesign.py
      - name: Format
        run: gofmt -w internal/workers internal/telegram internal/jobs internal/scheduler internal/app
      - name: Focused tests
        run: go test ./internal/workers ./internal/jobs ./internal/scheduler ./internal/telegram ./internal/app
      - name: Vet
        run: go vet ./...
      - name: Capture lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          golangci-lint run ./... 2>&1 | tee /tmp/lint.log
      - name: Capture race tests
        id: race
        continue-on-error: true
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee /tmp/race.log
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: p0-p1-diagnostics
          path: |
            /tmp/lint.log
            /tmp/race.log
      - name: Require clean validation
        if: steps.lint.outcome != 'success' || steps.race.outcome != 'success'
        run: exit 1
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: unify execution admission and scheduler claims'
          git push origin HEAD:audit-p0-p1-execution-redesign
