version: "2"
run:
  timeout: 3m
  go: "1.27"
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - misspell
    - revive
    - gocritic
  settings:
    errcheck:
      check-blank: false
      exclude-functions:
        - (*github.com/inipew/goultroid/internal/core.EventBus).Close
        - (*database/sql.DB).Close
        - (net/http.ResponseWriter).Write
    revive:
      enable-all-rules: false
      rules:
        - name: var-naming
        - name: package-comments
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
    gocritic:
      enable-all: false
      disabled-checks:
        - whyNoLint
        - hugeParam
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        path: ".*_test\\.go"
formatters:
  enable:
    - gofmt
    - goimports
issues:
  max-issues-per-linter: 50
  max-same-issues: 20
