version: "2"
run:
  timeout: 3m
  go: "1.27"
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - misspell
    - revive
    - gocritic
  settings:
    errcheck:
      check-blank: false
      exclude-functions:
        - (*github.com/inipew/goultroid/internal/core.EventBus).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Stmt).Close
        - (net/http.ResponseWriter).Write
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - os.Remove
        - os.RemoveAll
        - (*github.com/inipew/goultroid/internal/files).RemoveTempDir
        - (*github.com/inipew/goultroid/internal/files).RemoveTempFile
        - github.com/inipew/goultroid/internal/files.RemoveTempDir
        - github.com/inipew/goultroid/internal/files.RemoveTempFile
        - (*github.com/inipew/goultroid/internal/platform/network.Response).Close
        - (*github.com/inipew/goultroid/internal/platform/filesystem.Scope).RemoveTempDir
        - (*github.com/inipew/goultroid/internal/platform/filesystem.Scope).RemoveTempFile
    staticcheck:
      checks:
        - "all"
        - "-ST*"
        - "-QF*"
        - "-SA1019"
        - "-SA1012"
    revive:
      enable-all-rules: false
      rules:
        - name: var-naming
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
    gocritic:
      enable-all: false
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - unlambda
        - appendAssign
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        path: ".*_test\\.go"
formatters:
  enable:
    - gofmt
    - goimports
issues:
  max-issues-per-linter: 50
  max-same-issues: 20
